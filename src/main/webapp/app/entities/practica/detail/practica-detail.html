<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (practica(); as practicaRef) {
      <div>
        <h2 data-cy="practicaDetailsHeading"><span>Practica</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span>ID</span></dt>
          <dd>
            <span>{{ practicaRef.id }}</span>
          </dd>
          <dt><span>Cantidad</span></dt>
          <dd>
            <span>{{ practicaRef.cantidad }}</span>
          </dd>
          <dt><span>Pvalor</span></dt>
          <dd>
            <span>{{ practicaRef.pvalor }}</span>
          </dd>
          <dt><span>Prestacion</span></dt>
          <dd>
            @if (practica()!.prestacion) {
              <div>
                <a [routerLink]="['/prestacion', practica()!.prestacion?.id, 'view']">{{ practicaRef.prestacion?.codigo }}</a>
              </div>
            }
          </dd>
          <dt><span>Orden</span></dt>
          <dd>
            @if (practica()!.orden) {
              <div>
                <a [routerLink]="['/orden', practica()!.orden?.id, 'view']">{{ practicaRef.orden?.id }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span>Volver</span>
        </button>

        <button type="button" [routerLink]="['/practica', practicaRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span>Editar</span>
        </button>
      </div>
    }
  </div>
</div>
