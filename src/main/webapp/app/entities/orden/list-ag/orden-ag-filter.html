<div class="mb-3">
  <label class="form-label" for="paquete-filter">Paquete</label>
  <jhi-entity-selector
    inputId="paquete-filter"
    [options]="paqueteOptions()"
    [multiple]="true"
    [autocomplete]="true"
    placeholder="Buscar Paquete"
    (valueChange)="onPaqueteChange($event)"
  />
</div>
