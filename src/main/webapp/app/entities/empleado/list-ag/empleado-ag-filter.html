<div class="mb-3">
  <label class="form-label" for="usuario-filter">Usuario</label>
  <jhi-entity-selector
    inputId="usuario-filter"
    [options]="usuarioOptions()"
    [multiple]="true"
    [autocomplete]="true"
    placeholder="Buscar Usuario"
    (valueChange)="onUsuarioChange($event)"
  />
</div>
